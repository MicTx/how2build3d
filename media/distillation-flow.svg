<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 430" role="img" aria-labelledby="title desc">
  <title id="title">Saltline to how2build3d distillation flow</title>
  <desc id="desc">Read a runnable specimen, measure runtime evidence, distill reusable assets, build a new host scene, and verify it with gates.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#111820"/><stop offset="1" stop-color="#26323a"/></linearGradient>
    <linearGradient id="accent" x1="0" x2="1"><stop stop-color="#ffb347"/><stop offset="1" stop-color="#f27745"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity=".28"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#ffb347"/></marker>
  </defs>
  <rect width="1280" height="430" rx="18" fill="url(#bg)"/>
  <text x="64" y="62" fill="#f5eee3" font-family="ui-sans-serif,system-ui" font-size="30" font-weight="700">从 Saltline 到可复用场景能力</text>
  <text x="64" y="96" fill="#b8c0c4" font-family="ui-sans-serif,system-ui" font-size="17">研究对象不是黑盒依赖，而是可测量、可拆解、可验证的样本</text>
  <g filter="url(#shadow)" font-family="ui-sans-serif,system-ui">
    <g transform="translate(54 150)"><rect width="202" height="174" rx="12" fill="#202a31" stroke="#53636a"/><circle cx="31" cy="34" r="16" fill="#ffb347"/><text x="60" y="41" fill="#ffb347" font-size="16" font-weight="700">01 读取</text><text x="24" y="83" fill="#f5eee3" font-size="22" font-weight="700">Saltline</text><text x="24" y="113" fill="#b8c0c4" font-size="15">真实单文件游戏</text><text x="24" y="139" fill="#b8c0c4" font-size="15">源码 + 运行时 + 截图</text></g>
    <g transform="translate(310 150)"><rect width="202" height="174" rx="12" fill="#202a31" stroke="#53636a"/><circle cx="31" cy="34" r="16" fill="#ffb347"/><text x="60" y="41" fill="#ffb347" font-size="16" font-weight="700">02 观测</text><text x="24" y="83" fill="#f5eee3" font-size="22" font-weight="700">Evidence</text><text x="24" y="113" fill="#b8c0c4" font-size="15">draw / frame time</text><text x="24" y="139" fill="#b8c0c4" font-size="15">GLSL / error / audio</text></g>
    <g transform="translate(566 150)"><rect width="202" height="174" rx="12" fill="#202a31" stroke="#53636a"/><circle cx="31" cy="34" r="16" fill="#ffb347"/><text x="60" y="41" fill="#ffb347" font-size="16" font-weight="700">03 蒸馏</text><text x="24" y="83" fill="#f5eee3" font-size="22" font-weight="700">Reusable assets</text><text x="24" y="113" fill="#b8c0c4" font-size="15">常量 / 生成器 / 注入</text><text x="24" y="139" fill="#b8c0c4" font-size="15">降级链 / 研究文档</text></g>
    <g transform="translate(822 150)"><rect width="202" height="174" rx="12" fill="#202a31" stroke="#53636a"/><circle cx="31" cy="34" r="16" fill="#ffb347"/><text x="60" y="41" fill="#ffb347" font-size="16" font-weight="700">04 复用</text><text x="24" y="83" fill="#f5eee3" font-size="22" font-weight="700">New host scene</text><text x="24" y="113" fill="#b8c0c4" font-size="15">quality / gameplay</text><text x="24" y="139" fill="#b8c0c4" font-size="15">parity / starter</text></g>
    <g transform="translate(1078 150)"><rect width="150" height="174" rx="12" fill="url(#accent)"/><circle cx="31" cy="34" r="16" fill="#202a31"/><text x="60" y="41" fill="#202a31" font-size="16" font-weight="700">05 验收</text><text x="24" y="83" fill="#202a31" font-size="22" font-weight="700">Gates</text><text x="24" y="113" fill="#202a31" font-size="15">截图 / 统计</text><text x="24" y="139" fill="#202a31" font-size="15">对账 / 回归</text></g>
  </g>
  <g stroke="#ffb347" stroke-width="4" marker-end="url(#arrow)"><path d="M266 237H300"/><path d="M522 237H556"/><path d="M778 237H812"/><path d="M1034 237H1068"/></g>
  <text x="64" y="380" fill="#d6dadd" font-family="ui-monospace,monospace" font-size="16">R0 reference research → S0–S9 understand / distill / build / verify</text>
</svg>
